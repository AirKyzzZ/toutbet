[project]
name = "toutbet"
version = "0.1.0"
description = "ToutBet' MVP: mobile-first peer-to-peer betting platform, sandbox only"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
toutbet-admin = "toutbet.cli:main"
toutbet-worker = "toutbet.worker:main"
mock-psp = "mock_psp.main:run"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["toutbet", "mock_psp"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "N", "C4", "PT", "RET", "ARG"]
ignore = ["PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/toutbet/api/*.py" = ["ARG001", "PLR0917"]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "PLR0915", "ARG001", "ARG002", "ARG005", "PLR0917"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["toutbet", "mock_psp"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
