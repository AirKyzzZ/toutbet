name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
      - run: uv lock --check
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src

  tests:
    name: Unit, abuse and security tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
      - run: uv run --locked pytest

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
      - run: uv sync --locked --group e2e
      - name: Read the locked Playwright version
        id: playwright
        run: echo "version=$(uv run --locked --group e2e python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - name: Install Chromium and its system libraries
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: uv run --locked --group e2e playwright install --with-deps --only-shell chromium
      - name: Install the system libraries only
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: uv run --locked --group e2e playwright install-deps chromium
      - name: Run the E2E suite
        run: >-
          mkdir -p e2e-artifacts &&
          uv run --locked --group e2e pytest tests/e2e
          --tracing retain-on-failure
          --screenshot only-on-failure
          --output e2e-artifacts/playwright
          --basetemp e2e-artifacts/stack
      - name: Upload traces, screenshots and server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  postgres:
    name: Tests on PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
        env:
          POSTGRES_DB: toutbet
          POSTGRES_USER: toutbet_owner
          POSTGRES_PASSWORD: owner-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U toutbet_owner -d toutbet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://toutbet_app:app-ci-only@127.0.0.1:5432/toutbet
      DATABASE_ADMIN_URL: postgresql+psycopg://toutbet_owner:owner-ci-only@127.0.0.1:5432/toutbet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
      - name: Create the restricted application role
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i -e APP_DB_PASSWORD=app-ci-only "$POSTGRES_CONTAINER" sh < deploy/postgres/create-app-role.sh
      - run: uv run --locked pytest
      - name: Check that the grants test ran instead of being skipped
        run: uv run --locked pytest tests/security/test_pg_grants.py -q | grep "1 passed"

  semgrep:
    name: Semgrep OSS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the custom rules on their fixtures
        run: semgrep scan --test --metrics=off --config .semgrep/toutbet.yml .semgrep/tests/toutbet.py
      - name: Scan with the public packs and the custom rules
        run: >-
          semgrep scan --metrics=off --error
          --config p/default
          --config p/owasp-top-ten
          --config p/python
          --config p/secrets
          --config p/docker-compose
          --config p/dockerfile
          --config p/javascript
          --config p/github-actions
          --config .semgrep/toutbet.yml
          src tests deploy Dockerfile docker-compose.yml .github

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan the whole history with gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose --no-banner /repo
